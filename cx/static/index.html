<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cx dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">cx</span>
      <span class="brand-version" id="cx-version"></span>
    </div>
    <nav id="tabs" class="side-nav">
      <button class="tab-btn active" data-tab="sessions">
        <span class="nav-icon">●</span><span class="nav-label">Sessions</span>
      </button>
      <button class="tab-btn" data-tab="model">
        <span class="nav-icon">▤</span><span class="nav-label">Model</span>
      </button>
      <button class="tab-btn" data-tab="config">
        <span class="nav-icon">⚙</span><span class="nav-label">Config</span>
      </button>
      <button class="tab-btn" data-tab="doctor">
        <span class="nav-icon">✚</span><span class="nav-label">Doctor</span>
      </button>
      <button class="tab-btn" data-tab="debug">
        <span class="nav-icon">▶</span><span class="nav-label">Debug</span>
      </button>
    </nav>
    <div class="sidebar-foot">
      <div class="cwd" id="cwd" title=""></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="page-title">Sessions</h1>
      <div class="topbar-right">
        <span class="status-dot" id="conn-dot"></span>
        <span class="status-label" id="conn-label">live</span>
      </div>
    </header>

    <main>
      <section id="tab-sessions" class="tab active">
        <div class="hint" style="margin-bottom: 12px;">
          活跃 = 最后一条消息在 5 分钟内 · 每 4 秒刷新一次
        </div>
        <div id="sessions-list"></div>
      </section>

      <section id="tab-model" class="tab">
        <div class="stat-grid" id="model-stats"></div>
        <div class="panel">
          <h2>用量分布</h2>
          <canvas id="model-chart" height="90"></canvas>
        </div>
        <div class="panel">
          <h2>按模型明细</h2>
          <table id="model-table">
            <thead>
              <tr><th>model</th><th>sessions</th><th>messages</th><th>input</th>
                  <th>output</th><th>cache write</th><th>cache read</th><th>total</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="tab-config" class="tab">
        <div class="panel">
          <h2>配置来源</h2>
          <table id="sources-table">
            <thead><tr><th>scope</th><th>path</th><th>exists</th><th>keys</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="panel">
          <h2>Provenance</h2>
          <div id="provenance"></div>
        </div>
      </section>

      <section id="tab-doctor" class="tab">
        <div class="panel">
          <div id="doctor-summary" class="summary"></div>
          <div id="doctor-findings"></div>
        </div>
      </section>

      <section id="tab-debug" class="tab">
        <div class="panel terminal-panel">
          <div class="terminal-head">
            <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
            <span class="terminal-title">debug log</span>
            <span class="hint">stop_reason / requestId / tool_use / 报错文本 · 每 3 秒轮询新记录</span>
            <label class="follow-toggle">
              <input type="checkbox" id="follow-toggle" checked>
              <span>跟随最新</span>
            </label>
            <button id="clear-terminal" class="ghost-btn">清屏</button>
          </div>
          <div id="debug-log" class="terminal-body"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
